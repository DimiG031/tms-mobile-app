name: Mobile diagnostics regression
on:
  push:
    paths:
      - 'src/services/auth.ts'
      - 'src/services/upload.ts'
      - 'src/lib/api.ts'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/diagnostics*.ts'
      - 'scripts/diagnostics.test.mts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnostics.yml'
  pull_request:
    paths:
      - 'src/services/auth.ts'
      - 'src/services/upload.ts'
      - 'src/lib/api.ts'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/diagnostics*.ts'
      - 'scripts/diagnostics.test.mts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test scripts/diagnostics.test.mts

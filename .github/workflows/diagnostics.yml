name: Mobile diagnostics regression
on:
  push:
    paths:
      - 'src/services/auth.ts'
      - 'src/services/upload.ts'
      - 'src/lib/documentReadState.ts'
      - 'scripts/documentReadState.test.mts'
      - 'src/services/privateDocument.ts'
      - 'scripts/privateDocument.test.mts'
      - 'src/lib/api.ts'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/offline-owner.ts'
      - 'src/lib/secure-store.ts'
      - 'src/components/OfflineBanner.tsx'
      - 'scripts/sessionOwnership.test.mts'
      - 'scripts/queryScope.test.mts'
      - 'scripts/authBoundary.test.mts'
      - 'scripts/gpsOwnership.test.mts'
      - 'scripts/pushOwnership.test.mts'
      - 'src/services/notifications.ts'
      - 'src/lib/query-scope.ts'
      - 'src/providers/AuthProvider.tsx'
      - 'src/providers/QueryProvider.tsx'
      - 'src/services/gpsTracking.ts'
      - 'app/**/login.tsx'
      - 'src/lib/diagnostics*.ts'
      - 'scripts/diagnostics.test.mts'
      - 'scripts/offlineQueue.test.mts'
      - 'scripts/documentQueue.test.mts'
      - 'scripts/documentDeliveryNotice.test.mts'
      - 'app/_layout.tsx'
      - 'src/queries/useTourDocuments.ts'
      - 'app/**/documents.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnostics.yml'
  pull_request:
    paths:
      - 'src/services/auth.ts'
      - 'src/services/upload.ts'
      - 'src/lib/documentReadState.ts'
      - 'scripts/documentReadState.test.mts'
      - 'src/services/privateDocument.ts'
      - 'scripts/privateDocument.test.mts'
      - 'src/lib/api.ts'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/offline-owner.ts'
      - 'src/lib/secure-store.ts'
      - 'src/components/OfflineBanner.tsx'
      - 'scripts/sessionOwnership.test.mts'
      - 'scripts/queryScope.test.mts'
      - 'scripts/authBoundary.test.mts'
      - 'scripts/gpsOwnership.test.mts'
      - 'scripts/pushOwnership.test.mts'
      - 'src/services/notifications.ts'
      - 'src/lib/query-scope.ts'
      - 'src/providers/AuthProvider.tsx'
      - 'src/providers/QueryProvider.tsx'
      - 'src/services/gpsTracking.ts'
      - 'app/**/login.tsx'
      - 'src/lib/diagnostics*.ts'
      - 'scripts/diagnostics.test.mts'
      - 'scripts/offlineQueue.test.mts'
      - 'scripts/documentQueue.test.mts'
      - 'src/queries/useTourDocuments.ts'
      - 'app/**/documents.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --experimental-strip-types --test scripts/diagnostics.test.mts
      - run: node --experimental-strip-types scripts/offlineQueue.test.mts
      - run: node --experimental-strip-types scripts/documentQueue.test.mts
      - run: node --experimental-strip-types scripts/privateDocument.test.mts
      - run: node --experimental-strip-types scripts/documentReadState.test.mts
      - run: node --experimental-strip-types scripts/documentDeliveryNotice.test.mts
      - run: node --experimental-strip-types scripts/sessionOwnership.test.mts
      - run: node --experimental-strip-types scripts/queryScope.test.mts
      - run: node --experimental-strip-types scripts/authBoundary.test.mts
      - run: node --experimental-strip-types scripts/gpsOwnership.test.mts
      - run: node --experimental-strip-types scripts/pushOwnership.test.mts

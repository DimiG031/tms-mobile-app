permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --experimental-strip-types --test scripts/diagnostics.test.mts
      - run: node --experimental-strip-types scripts/offlineQueue.test.mts
      - run: node --experimental-strip-types scripts/gpsDelivery.test.mts
      - run: node --experimental-strip-types scripts/gpsTransport.test.mts
      - run: node --experimental-strip-types scripts/stopActionState.test.mts
      - run: node --experimental-strip-types scripts/stopStatusLabels.test.mts
      - run: node --experimental-strip-types scripts/documentQueue.test.mts
      - run: node --experimental-strip-types scripts/privateDocument.test.mts
      - run: node --experimental-strip-types scripts/documentReadState.test.mts
      - run: node --experimental-strip-types scripts/documentDeliveryNotice.test.mts
      - run: node --experimental-strip-types scripts/sessionOwnership.test.mts
      - run: node --experimental-strip-types scripts/queryScope.test.mts
      - run: node --experimental-strip-types scripts/authBoundary.test.mts
      - run: node --experimental-strip-types scripts/crewSwitch.test.mts
      - run: node --experimental-strip-types scripts/gpsOwnership.test.mts
      - run: node --experimental-strip-types scripts/gpsBridgeCheckpoint.test.mts
      - run: node --experimental-strip-types scripts/gpsEntry.test.mts
      - run: node --experimental-strip-types scripts/gpsNativeProbe.test.mts
      - run: node --experimental-strip-types scripts/gpsNativeRepair.test.mts
      - run: node --experimental-strip-types scripts/gpsDevLaunch.test.mts
      - run: node --experimental-strip-types scripts/tourStatusGps.test.mts
      - run: node --experimental-strip-types scripts/pushOwnership.test.mts
